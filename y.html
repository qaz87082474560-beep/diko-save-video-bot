<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Heart</title>
<style>
    body {
        margin: 0;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    #heart {
        position: relative;
        width: 700px;
        height: 700px;
        animation: pulse 2s infinite;
    }

    .text {
        position: absolute;
        color: #ff4da6;
        font-size: 18px;
        font-weight: bold;
        text-shadow: 0 0 10px #ff4da6;
        animation: float 3s infinite alternate;
    }

    @keyframes pulse {
        0% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.1);
        }
        100% {
            transform: scale(1);
        }
    }

    @keyframes float {
        from {
            opacity: 0.6;
            transform: translateY(0px);
        }
        to {
            opacity: 1;
            transform: translateY(-10px);
        }
    }
</style>
</head>
<body>

<div id="heart"></div>

<script>
const heart = document.getElementById("heart");

for (let t = 0; t < Math.PI * 2; t += 0.15) {
    let x = 16 * Math.pow(Math.sin(t), 3);
    let y = 13 * Math.cos(t)
          - 5 * Math.cos(2 * t)
          - 2 * Math.cos(3 * t)
          - Math.cos(4 * t);

    let span = document.createElement("span");
    span.className = "text";
    span.innerText = "I love you";

    span.style.left = (x * 18 + 300) + "px";
    span.style.top = (-y * 18 + 300) + "px";

    span.style.animationDelay = Math.random() * 2 + "s";

    heart.appendChild(span);
}
</script>

</body>
</html>
